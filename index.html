<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3FA0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1320" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duka Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Duka Ledger</title>
<style>
/* Layout: one-column phone app styled like a counter book: ruled lines, red margin rule, ballpoint-blue ink, double-underlined totals. */
:root{
  --paper:#F2F6FA; --card:#FFFFFF; --text:#16203A; --muted:#566178; --line:#D3DCE8;
  --ink:#1B3FA0; --on-ink:#FFFFFF; --margin:#D9493C;
  --good:#17724A; --on-good:#FFFFFF; --good-bg:#E2F4EA;
  --warn:#8A5A00; --warn-bg:#FFF0CF; --bad:#B0261C; --bad-bg:#FDE6E3;
  --scrim:rgba(10,15,30,.5);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0E1320; --card:#171E2E; --text:#E8ECF5; --muted:#9BA7BE; --line:#2A3448;
    --ink:#8EA8FF; --on-ink:#0E1320; --margin:#E8685C;
    --good:#5CCB92; --on-good:#0E1320; --good-bg:#16372A;
    --warn:#F2B84B; --warn-bg:#3A2D0E; --bad:#FF8C82; --bad-bg:#40191A;
    --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--text);font:16px/1.4 var(--font);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h2,h3,p{margin:0}

#app{max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:max(14px,env(safe-area-inset-top,0px)) 4px}
.brand{font-weight:800;font-size:1.3rem;letter-spacing:-.01em;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#view{padding-bottom:170px}

.total{padding:12px 0 14px}
.label,.lbl{display:block;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.total .label{margin:0 0 4px}
.big{display:inline-block;font-size:2.4rem;line-height:1.15;font-weight:800;font-variant-numeric:tabular-nums;border-bottom:4px double var(--ink);padding-bottom:2px}
.subline{margin-top:8px;color:var(--muted);font-size:.9rem}
.bad-t{color:var(--bad);font-weight:700}
.hint{color:var(--muted);font-size:.88rem;margin:6px 0 10px}
.h{font-size:1.3rem;margin:12px 0 4px}

.inp{display:block;width:100%;min-height:48px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
.inp:focus{border-color:var(--ink)}
.inp.big-in{font-size:1.6rem;font-weight:800;min-height:58px;font-variant-numeric:tabular-nums}
#view>.inp{background:var(--card);margin-bottom:12px}

.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.pay{border-color:var(--good);color:var(--good)}
.btn.pay.primary{background:var(--good);color:var(--on-good)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.sm{min-height:40px;padding:0 12px;font-size:.88rem}
.btns{display:flex;gap:10px;margin-top:16px}
.btns .btn{flex:1}
.link{background:none;border:0;padding:6px 0;color:var(--ink);text-decoration:underline;font-weight:600;min-height:32px}
.link.sm{font-size:.8rem;color:var(--muted);font-weight:500}

.book{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{display:flex;width:100%;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;text-align:left;min-height:60px}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--muted);font-size:.82rem}
.rt{text-align:right;flex:none}
.amt{display:block;font-weight:800;font-variant-numeric:tabular-nums}
.amt.good{color:var(--good)}
.amt.zero{color:var(--muted)}
.rt small{color:var(--muted);font-size:.8rem}
.rt small.bad-t{color:var(--bad)}
.row-act{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px}
.tag{display:inline-block;font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.none{padding:26px 16px;text-align:center;color:var(--muted)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.9rem;font-weight:600}
.banner .btn{min-height:40px;border-color:currentColor;color:inherit;flex:none}

.empty{padding:28px 4px;display:flex;flex-direction:column;gap:12px}
.empty h2{font-size:1.4rem}
.empty p{color:var(--muted)}

.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 12px}
.seg button{flex:1;min-height:46px;background:var(--card);border:0;border-right:1px solid var(--line);font-weight:700;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.seg button.pay[aria-pressed="true"]{background:var(--good);color:var(--on-good)}

.back{background:none;border:0;color:var(--ink);font-weight:700;padding:12px 0 4px;min-height:44px}
.head{padding:4px 0 14px}
.head h2{font-size:1.5rem;overflow-wrap:anywhere}
.head .ph{color:var(--muted)}
.head .big{margin-top:8px}
.head .lim{color:var(--muted);font-size:.88rem;margin-top:8px}
.preview{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.88rem;line-height:1.5;padding:12px;border:1.5px dashed var(--line);border-radius:10px;background:var(--card);color:var(--text)}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two-btn .btn{min-height:52px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}

.led-h,.led{display:grid;grid-template-columns:58px minmax(0,1fr) auto}
.led-h{background:var(--paper);border-bottom:3px double var(--line);font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.led-h span{padding:8px 10px}
.led{border-bottom:1px solid var(--line)}
.led:last-child{border-bottom:0}
.led .d{border-right:2px solid var(--margin);padding:10px 4px;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.led .d b{display:block;font-size:1.2rem}
.led .d span{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.led .m{padding:10px 12px;min-width:0}
.led .m .what{font-weight:600;overflow-wrap:anywhere}
.led .m .ty{font-size:.76rem;color:var(--muted)}
.led .a{padding:10px 14px 10px 4px;text-align:right;font-variant-numeric:tabular-nums}
.led .a b{display:block}
.led .a.cr b{color:var(--ink)}
.led .a.pm b{color:var(--good)}
.led .a span{font-size:.76rem;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 14px 16px;margin-top:12px}
.card h3{font-size:1rem;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card .acts .btn{flex:1 1 auto}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;border-top:3px solid transparent;margin-top:-1px;min-height:54px;padding:8px 2px;font-weight:700;font-size:.82rem;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
.tab .n{display:inline-block;min-width:20px;margin-left:5px;padding:0 6px;border-radius:99px;background:var(--bad-bg);color:var(--bad);font-size:.74rem}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));min-height:54px;padding:0 22px;border-radius:99px;border:0;background:var(--ink);color:var(--on-ink);font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:21}

#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;width:100%;max-width:560px;max-height:94%;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding-block:18px max(18px,env(safe-area-inset-bottom,0px));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.panel h2{font-size:1.2rem;margin-bottom:4px}
.picked{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-top:6px}
.picked b{display:block;overflow-wrap:anywhere}
.picked small{color:var(--muted)}
.sugg{display:flex;justify-content:space-between;gap:10px;width:100%;min-height:46px;align-items:center;padding:0 12px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.sugg small{color:var(--muted);font-variant-numeric:tabular-nums}
.sugg.add{color:var(--ink);font-weight:700}
#es-sugg{margin-top:4px;max-height:34vh;overflow:auto}
.warnbox{margin-top:14px;padding:12px;border-radius:10px;background:var(--warn-bg);color:var(--warn)}
.warnbox ul{margin:6px 0 0;padding-left:18px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));max-width:min(92vw,420px);background:var(--text);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.92rem;z-index:80;text-align:center}

#lock{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
.pad{width:100%;max-width:320px;text-align:center}
.pad h2{font-size:1.3rem}
.pad .sub{color:var(--muted);min-height:1.4em;margin-top:6px}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 24px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.keys button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:1.5rem;font-weight:700}
.pad .btn{margin-top:8px;width:100%}
.filebtn{cursor:pointer}

/* ===== v3: app-style polish ===== */
.ic{width:22px;height:22px;flex:none}
.btn .ic,.link .ic{width:18px;height:18px;margin-right:6px}
button,.btn,.row-main,.chip,.sugg,.qa{transition:transform .12s ease,background-color .15s ease,border-color .15s ease,opacity .15s ease}
.btn:active,.tab:active,.chip:active,.qa:active,.seg button:active,.ico:active{transform:scale(.96)}
.fab:active{transform:scale(.93)}
.row-main:active,.sugg:active{background:var(--paper)}
.fab{display:flex;align-items:center;gap:8px;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.fab .ic{width:20px;height:20px}
#toast{bottom:calc(142px + env(safe-area-inset-bottom,0px))}

/* sticky app header */
.top{position:sticky;top:0;z-index:15;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:var(--paper);background:color-mix(in srgb,var(--paper) 90%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:box-shadow .2s}
.top.scrolled{box-shadow:0 1px 0 var(--line)}
.top-id{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-size:1.12rem}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--ink);color:var(--on-ink);font-weight:800;font-size:1.1rem}
.avatar.lg{width:56px;height:56px;font-size:1.5rem}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;background:hsl(var(--h) 55% 90%);color:hsl(var(--h) 60% 26%)}
.av.lg-av{width:56px;height:56px;font-size:1.4rem}
@media (prefers-color-scheme: dark){.av{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 70% 82%)}}

/* home */
.hero{margin:6px 0 14px;padding:18px 18px 16px;border-radius:18px;color:var(--on-ink);
  background:linear-gradient(145deg,var(--ink),color-mix(in srgb,var(--ink) 68%,#000));
  box-shadow:0 12px 26px -14px color-mix(in srgb,var(--ink) 80%,transparent)}
@media (prefers-color-scheme: dark){.hero{background:linear-gradient(145deg,var(--ink),color-mix(in srgb,var(--ink) 72%,#fff))}}
.hero .label{color:inherit;opacity:.85;margin:0 0 6px}
.hero .big{border-bottom-color:currentColor;font-size:2.5rem}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hchip{font-size:.8rem;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.2);color:inherit}
@media (prefers-color-scheme: dark){.hchip{background:rgba(0,0,0,.14)}}
.hchip.alert{background:var(--bad-bg);color:var(--bad)}
.hchip.ok{background:var(--good-bg);color:var(--good)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.qa{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:800;text-align:left;color:var(--text)}
.qa .qi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--paper);background:color-mix(in srgb,var(--ink) 14%,transparent);color:var(--ink)}
.qa.pay .qi{background:var(--good-bg);color:var(--good)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 8px}
.sec h3{margin:0;font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips-l{flex:none;align-self:center;font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:.85rem;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.amt-chips{padding:8px 0 0}
.head-id{display:flex;align-items:center;gap:14px}

/* tabs with icons */
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;font-size:.72rem}
.tab .ti{position:relative;display:inline-flex}
.tab .n{position:absolute;top:-6px;left:13px;margin:0;min-width:17px;padding:0 5px;font-size:.65rem;line-height:17px;text-align:center}

/* ledger manage mode + trash */
.sec .btn.sm{min-height:34px}
.book.editing .led-h,.book.editing .led{grid-template-columns:58px minmax(0,1fr) auto 50px}
.led .x{display:flex;align-items:center;justify-content:center;padding-right:8px}
.ico{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--bad);background:var(--bad-bg);color:var(--bad);display:grid;place-items:center;padding:0}
.ico .ic{width:18px;height:18px;margin:0}

/* danger zone (customer sheet) */
.dz{margin-top:22px;padding:14px;border:1.5px dashed var(--bad);border-radius:12px;background:var(--bad-bg)}
.dz-t{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--bad);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.dz-t .ic{width:18px;height:18px}
.dz .hint{margin:6px 0 12px;color:var(--bad)}
.dz .btn{width:100%;background:var(--card)}

/* settings */
.prof{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin:10px 0 2px}
.prof b{display:block;font-size:1.15rem;overflow-wrap:anywhere}
.prof small{color:var(--muted)}
.sgt{display:flex;align-items:center;gap:8px;margin:22px 4px 8px;font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sgt .ic{width:18px;height:18px}
.sg-h{margin:-2px 4px 8px}
.sgroup{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.srow{padding:12px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .lbl{margin:0 0 6px}
.srow .seg{margin:0}
.srow .hint{margin:0}
.srow.line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.srow.line b{font-weight:700;display:block}
.srow.line small{display:block;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.srow .acts{margin-top:0}
.srow .acts .btn{flex:1 1 auto}
.srow .val{font-weight:700;text-align:right}
.pill{flex:none;display:inline-block;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--muted)}
.pill.on{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.sgroup.danger{border-color:var(--bad)}


/* settings accordion */
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px}
.acc.danger{border-color:var(--bad)}
.acc-h{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:10px 14px;background:none;border:0;text-align:left}
.acc-h:active{background:var(--paper)}
.acc-i{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--paper);color:var(--ink)}
.acc.danger .acc-i{background:var(--bad-bg);color:var(--bad)}
.acc-t{flex:1;min-width:0}
.acc-t b{display:block;font-weight:800}
.acc-t small{display:block;color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-c{display:inline-flex;flex:none;color:var(--muted);transition:transform .22s ease}
.acc-c .ic{width:20px;height:20px}
.acc.open .acc-c{transform:rotate(180deg)}
.acc-b{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .24s ease,visibility 0s .24s}
.acc.open .acc-b{grid-template-rows:1fr;visibility:visible;transition-delay:0s}
.acc-in{overflow:hidden;min-height:0}
.acc-in>.srow:first-child{border-top:1px solid var(--line)}

/* sheets + motion */
.grab{position:relative;width:42px;height:5px;border-radius:99px;background:var(--line);margin:-6px auto 14px;touch-action:none}
.grab::before{content:"";position:absolute;inset:-16px -48px}
.panel.anim{animation:sheetUp .24s cubic-bezier(.2,.8,.2,1)}
.scrim.anim{animation:fadeIn .2s ease-out}
.view-in{animation:viewIn .24s ease-out}
.toast-in{animation:toastIn .22s ease-out}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- state & storage ---------- */
let storageOk = true;
function blank(){
  return {v:1, customers:[], entries:[], settings:{lang:'en', shop:'', defAmt:2000, defDays:14, pin:'', lastBackup:0, mailKey:'', mailPending:false}};
}
let db = blank();
function t(k, p){
  let s = (L[db.settings.lang] || L.en)[k];
  if (s == null) s = L.en[k];
  if (s == null) s = k;
  if (p) for (const x in p) s = s.split('{' + x + '}').join(p[x]);
  return s;
}
function load(){
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { storageOk = false; }
  try {
    const s = localStorage.getItem(KEY);
    if (s) { const d = JSON.parse(s); const b = blank(); return {v:1, customers:Array.isArray(d.customers)?d.customers:[], entries:Array.isArray(d.entries)?d.entries:[], settings:Object.assign(b.settings, d.settings || {})}; }
  } catch (e) { storageOk = false; }
  return blank();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); storageOk = true; } catch (e) { storageOk = false; }
}
const cust = id => db.customers.find(c => c.id === id);

/* ---------- ledger maths ---------- */
/* Payments are applied to the oldest credit first. "Days owing" is the age of the oldest credit still unpaid. */
function stats(c, list){
  const es = (list || db.entries.filter(e => e.cid === c.id)).slice().sort((a, b) => a.ts - b.ts);
  let credit = 0, paid = 0, lastPay = 0;
  for (const e of es) { if (e.type === 'credit') credit += e.amt; else { paid += e.amt; if (e.ts > lastPay) lastPay = e.ts; } }
  const bal = r2(credit - paid);
  let oldest = 0;
  const open = [];   // unpaid credits, oldest first, with what is still owed on each
  if (bal > 0) {
    let p = paid;
    for (const e of es) {
      if (e.type !== 'credit') continue;
      if (p >= e.amt - 0.005) { p -= e.amt; continue; }
      const left = r2(e.amt - p); p = 0;
      if (!oldest) oldest = e.ts;
      open.push({ts:e.ts, amt:left, note:e.note || ''});
    }
  }
  const days = oldest ? Math.max(0, Math.floor((Date.now() - oldest) / DAY)) : 0;
  const limA = c.limitAmt > 0 ? c.limitAmt : db.settings.defAmt;
  const limD = c.limitDays > 0 ? c.limitDays : db.settings.defDays;
  return {bal, days, oldest, lastPay, limA, limD, es, open, last: es.length ? es[es.length - 1].ts : (c.created || 0),
          overAmt: limA > 0 && bal > limA,
          overDays: limD > 0 && bal > 0 && days > limD};
}
let SA = null;
function allStats(){
  if (SA) return SA;
  const m = {};
  for (const e of db.entries) (m[e.cid] || (m[e.cid] = [])).push(e);
  SA = db.customers.map(c => ({c, s: stats(c, m[c.id] || [])}));
  return SA;
}
const dl = n => n <= 0 ? t('today') : n === 1 ? t('day1') : t('days', {n});
function whenText(ts){
  if (!ts) return t('never');
  const n = Math.floor((Date.now() - ts) / DAY);
  return n <= 0 ? t('today') : n === 1 ? t('yesterday') : t('daysAgo', {n});
}
function locale(){ return db.settings.lang === 'sw' ? 'sw-KE' : 'en-KE'; }
function waNumber(p){
  let d = String(p || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = '254' + d.slice(1);
  else if (d.length === 9 && /^[17]/.test(d)) d = '254' + d;
  return d;
}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
/* Reminder text: shop name, total owed, then each unpaid credit with the date and time it was taken. */
function remindText(c, s){
  const shop = db.settings.shop;
  const lines = [t(shop ? 'remindHead' : 'remindHeadNoShop', {name:c.name, shop, amt:money(s.bal)}), ''];
  const MAX = 6, shown = s.open.slice(0, MAX);
  for (const o of shown) {
    const d = new Date(o.ts);
    const when = d.toLocaleDateString(locale(), {day:'numeric', month:'short', year:'numeric'}) + ', ' +
                 d.toLocaleTimeString(locale(), {hour:'numeric', minute:'2-digit'});
    lines.push('- ' + when + (o.note ? ' (' + o.note + ')' : '') + ': ' + money(o.amt));
  }
  if (s.open.length > MAX) lines.push('- ' + t('remindMore', {n:s.open.length - MAX}));
  lines.push('', t('remindTail'));
  return lines.join('\n');
}
function remindLinks(c, s){
  const n = waNumber(c.phone);
  if (!n) return null;
  const q = encodeURIComponent(remindText(c, s));
  /* Android reads "?body=", iPhone reads "&body=" */
  return {wa:'https://wa.me/' + n + '?text=' + q, sms:'sms:+' + n + (isIOS ? '&' : '?') + 'body=' + q};
}
function remindBtns(c, s){
  if (!(s.bal > 0)) return '';
  const lk = remindLinks(c, s);
  return (lk ? '<a class="btn sm" href="' + lk.wa + '" target="_blank" rel="noopener">WhatsApp</a>' +
               '<button class="btn sm" data-act="sms" data-id="' + c.id + '">SMS</button>' : '') +
    '<button class="btn sm ghost" data-act="copy-msg" data-id="' + c.id + '">' + esc(t('copy')) + '</button>';
}
function openSms(href){
  let left = false;
  const mark = () => { if (document.hidden) left = true; };
  const mark2 = () => { left = true; };
  document.addEventListener('visibilitychange', mark);
  window.addEventListener('blur', mark2);
  const a = document.createElement('a');
  a.href = href; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => {
    document.removeEventListener('visibilitychange', mark);
    window.removeEventListener('blur', mark2);
    if (!left) toast(t('smsHint'));
  }, 1800);
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove();
    return ok;
  }
}
function matches(c, q){
  if (!q) return true;
  const ql = q.toLowerCase(), qd = q.replace(/\D/g, '');
  return c.name.toLowerCase().includes(ql) || (qd.length > 0 && String(c.phone || '').replace(/\D/g, '').includes(qd));
}

   Every screen change (tab, customer) and every open sheet is one history entry,
   so the phone's back button steps back through them instead of leaving the app. */
let navDepth = 0, sheetPushed = false, ignorePop = 0;
function curState(){ return {tab:ui.tab, cust:ui.cust, q:ui.q}; }
function navTo(tab, cust){
  if (tab === ui.tab && cust === ui.cust) { window.scrollTo(0, 0); return; }
  try { history.replaceState(Object.assign(curState(), {sy:window.scrollY}), ''); } catch (e) {}
  ui.tab = tab; ui.cust = cust; ui.q = ''; ui.edit = false; ui.animHero = (tab === 'owes' && !cust);
  try { history.pushState(curState(), ''); navDepth++; } catch (e) {}
  render(); window.scrollTo(0, 0); animView();
}
function animView(){ const v = $('#view'); v.classList.remove('view-in'); void v.offsetWidth; v.classList.add('view-in'); }
function goBack(){
  if (navDepth > 0) { history.back(); return; }
  ui.cust = null;
  try { history.replaceState(curState(), ''); } catch (e) {}
  render();
}
window.addEventListener('popstate', e => {
  if (ignorePop > 0) {            // we closed a sheet ourselves; just keep the entry in step with the screen
    ignorePop--;
    try { history.replaceState(curState(), ''); } catch (_) {}
    return;
  }
  if (!$('#sheet').hidden) { closeSheet(true); return; }   // back pressed while a sheet is open: close it
  const st = e.state;
  if (!st || st.sheet) return;
  navDepth = Math.max(0, navDepth - 1);
  ui.tab = st.tab || 'owes'; ui.cust = st.cust || null; ui.q = st.q || ''; ui.edit = false; ui.animHero = (ui.tab === 'owes' && !ui.cust);
  render(); window.scrollTo(0, st.sy || 0); animView();
});

function toast(msg, ms){
  const el = $('#toast');
  el.textContent = msg; el.hidden = false;
  el.classList.remove('toast-in'); void el.offsetWidth; el.classList.add('toast-in');
  clearTimeout(toast.h);
  toast.h = setTimeout(() => { el.hidden = true; }, ms || 2800);
}

/* the big total counts up once each time the home screen is opened */
function heroCount(){
  const el = $('#hero-total');
  if (!el || !ui.animHero) return;
  ui.animHero = false;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const to = Number(el.dataset.v) || 0;
  if (!to) return;
  const t0 = performance.now(), dur = 650;
  (function step(now){
    if (!el.isConnected) return;
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = p < 1 ? money(Math.round(to * e)) : money(to);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

  else if (kind === 'overdue') { items = items.filter(x => x.s.bal > 0 && x.s.days >= ui.od); none = t('noOverdue', {n:ui.od}); }
  else { none = t('noMatch'); }
  items = items.slice().sort(SORTS[ui.sort[kind]] || SORTS.name);

  const r = $('#sheet'), first = r.hidden;
  r.innerHTML = '<div class="scrim' + (first ? ' anim' : '') + '" data-act="close-sheet"></div><div class="panel' + (first ? ' anim' : '') + '" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div>' + html + '</div>';
  r.hidden = false;
  document.body.classList.add('noscroll');
  if (!sheetPushed) {
    try { history.pushState(Object.assign(curState(), {sheet:1}), ''); sheetPushed = true; } catch (e) {}
  }
}
function closeSheet(fromPop){
  const r = $('#sheet');
  r.hidden = true; r.innerHTML = '';
  document.body.classList.remove('noscroll');
  es = null;
  if (sheetPushed) {
    sheetPushed = false;
    if (fromPop !== true) { ignorePop++; try { history.back(); } catch (e) { ignorePop--; } }
  }
}
function openConfirm(msg, yesLabel, fn, danger){
  pendingConfirm = fn;
  openSheet('<p style="font-size:1.05rem">' + esc(msg) + '</p><div class="btns"><button class="btn ghost" data-act="close-sheet">' + esc(t('cancel')) + '</button>' +
    '<button class="btn ' + (danger ? 'danger' : 'primary') + '" data-act="confirm-yes">' + esc(yesLabel) + '</button></div>');
}

function openEntry(cid, type){
  es = {cid:cid || null, type:type || 'credit', amt:'', note:'', q:'', warn:null};
  drawEntry();
}
function syncEs(){
  if (!es) return;
  const a = $('#es-amt'), n = $('#es-note'), q = $('#es-q');
  if (a) es.amt = a.value;
  if (n) es.note = n.value;
  if (q) es.q = q.value;
}
function drawEntry(){
  const c = es.cid ? cust(es.cid) : null;
  const s = c ? stats(c) : null;
  const isC = es.type === 'credit';
  let h = '<h2>' + esc(t('newEntry')) + '</h2>';
  if (c) {
    h += '<div class="picked"><div><b>' + esc(c.name) + '</b><small>' + esc(s.bal > 0 ? t('owes', {amt:money(s.bal)}) : t('noDebt')) + '</small></div>' +
         '<button class="link" data-act="es-change">' + esc(t('change')) + '</button></div>';
  } else {
    h += '<label class="lbl" for="es-q">' + esc(t('customer')) + '</label><input id="es-q" class="inp" type="search" autocomplete="off" placeholder="' + esc(t('searchPh')) + '" value="' + esc(es.q) + '"><div id="es-sugg"></div>';
  }
  h += '<div class="seg" style="margin-top:14px"><button data-act="es-type" data-id="credit" aria-pressed="' + isC + '">' + esc(t('credit')) + '</button>' +
       '<button class="pay" data-act="es-type" data-id="payment" aria-pressed="' + !isC + '">' + esc(t('payment')) + '</button></div>';
  h += '<label class="lbl" for="es-amt" style="margin-top:0">' + esc(t('amount')) + '</label><input id="es-amt" class="inp big-in" inputmode="decimal" autocomplete="off" placeholder="0" value="' + esc(es.amt) + '">';
  h += '<div class="chips amt-chips">' + (!isC && s && s.bal > 0 ? '<button class="chip" data-act="es-full" data-id="' + s.bal + '">' + esc(t('payFull', {amt:money(s.bal)})) + '</button>' : '') +
       [50, 100, 200, 500, 1000].map(n => '<button class="chip" data-act="es-add" data-id="' + n + '">+' + nf.format(n) + '</button>').join('') + '</div>';
  h += '<label class="lbl" for="es-note">' + esc(t('note')) + '</label><input id="es-note" class="inp" autocomplete="off" placeholder="' + esc(t('notePh')) + '" value="' + esc(es.note) + '">';
  if (es.warn && c) {
    h += '<div class="warnbox"><b>' + esc(t('warnTitle', {name:c.name})) + '</b><ul>' + es.warn.map(w => '<li>' + esc(w) + '</li>').join('') + '</ul></div>' +
         '<div class="btns"><button class="btn ghost" data-act="es-unwarn">' + esc(t('goBack')) + '</button><button class="btn danger" data-act="es-force">' + esc(t('addAnyway')) + '</button></div>';
  } else {
    h += '<div class="btns"><button class="btn ghost" data-act="close-sheet">' + esc(t('cancel')) + '</button>' +
         '<button class="btn ' + (isC ? 'primary' : 'pay primary') + '" data-act="es-save">' + esc(t(isC ? 'saveCredit' : 'savePayment')) + '</button></div>';
  }
  openSheet(h);
  if (!c) fillSugg();
  setTimeout(() => { const f = $(c ? '#es-amt' : '#es-q'); if (f) f.focus(); }, 60);
}
function fillSugg(){
  const box = $('#es-sugg');
  if (!box || !es) return;
  const q = es.q.trim(), ql = q.toLowerCase();
  const touch = {};
  for (const e of db.entries) if (!touch[e.cid] || e.ts > touch[e.cid]) touch[e.cid] = e.ts;
  const sm = {};
  for (const x of allStats()) sm[x.c.id] = x.s;
  const list = db.customers.filter(c => matches(c, q))
    .sort((a, b) => (touch[b.id] || b.created || 0) - (touch[a.id] || a.created || 0)).slice(0, 6);
  let h = list.map(c => {
    const s = sm[c.id];
    return '<button class="sugg" data-act="es-pick" data-id="' + c.id + '"><span>' + esc(c.name) + '</span><small>' + (s && s.bal > 0 ? money(s.bal) : '') + '</small></button>';
  }).join('');
  if (q && !db.customers.some(c => c.name.toLowerCase() === ql))
    h += '<button class="sugg add" data-act="es-newc">+ ' + esc(t('addNew', {q})) + '</button>';
  box.innerHTML = h;
}
function saveEntry(force){
  syncEs();
  if (!es.cid) { toast(t('pickCustomer')); return; }
  const amt = r2(parseFloat(String(es.amt).replace(/[^0-9.]/g, '')));
  if (!(amt > 0)) { toast(t('enterAmount')); const f = $('#es-amt'); if (f) f.focus(); return; }
  const c = cust(es.cid), s = stats(c);
  if (es.type === 'credit' && !force) {
    const why = [], nb = r2(s.bal + amt);
    if (s.limA > 0 && nb > s.limA) why.push(t('warnAmt', {bal:money(nb), lim:money(s.limA)}));
    if (s.limD > 0 && s.bal > 0 && s.days > s.limD) why.push(t('warnDays', {d:s.limD, n:s.days}));
    if (why.length) { es.warn = why; drawEntry(); return; }
  }
  db.entries.push({id:uid(), cid:c.id, type:es.type, amt, note:es.note.trim(), ts:Date.now()});
  save(); closeSheet(); render();
  buzz(12);
  const ns = stats(c);
  toast(c.name + ': ' + (ns.bal > 0 ? t('owes', {amt:money(ns.bal)}) : ns.bal < 0 ? t('paidAhead') : t('settled')));
}

/* ---------- PIN lock ---------- */
function hashPin(p){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  const s = 'duka|' + p;
  for (let i = 0, ch; i < s.length; i++) { ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function hidePad(){ const el = $('#lock'); el.hidden = true; el.innerHTML = ''; el.onclick = null; }
function showPad(o){
  const el = $('#lock');
  let buf = '';
  el.hidden = false;
  function draw(msg){
    let keys = '';
    for (let i = 1; i <= 9; i++) keys += '<button data-pad="' + i + '">' + i + '</button>';
    keys += '<span></span><button data-pad="0">0</button><button data-pad="del" aria-label="Delete">←</button>';
    el.innerHTML = '<div class="pad"><h2>' + esc(o.title) + '</h2><p class="sub">' + esc(msg || '') + '</p><div class="dots">' +
      [0, 1, 2, 3].map(i => '<i class="' + (i < buf.length ? 'on' : '') + '"></i>').join('') + '</div><div class="keys">' + keys + '</div>' +
      (o.cancelable ? '<button class="btn ghost" data-pad="cancel">' + esc(t('cancel')) + '</button>' : '') +
      (o.forgot ? '<button class="link" data-pad="forgot">' + esc(t('forgotPin')) + '</button>' : '') + '</div>';
  }
  el.onclick = e => {
    const b = e.target.closest('[data-pad]');
    if (!b) return;
    const k = b.dataset.pad;
    if (k === 'cancel') { hidePad(); return; }
    if (k === 'forgot') {
      el.innerHTML = '<div class="pad"><h2>' + esc(t('forgotTitle')) + '</h2><p class="sub" style="margin:10px 0 18px">' + esc(t('forgotBody')) + '</p>' +
        '<label class="btn primary filebtn">' + esc(t('chooseBackup')) + '<input type="file" id="lock-file" accept=".json,application/json" hidden></label>' +
        '<button class="btn ghost" data-pad="again">' + esc(t('back')) + '</button></div>';
      return;
    }
    if (k === 'again') { buf = ''; draw(); return; }
    if (k === 'del') buf = buf.slice(0, -1);
    else if (buf.length < 4) buf += k;
    draw();
    if (buf.length === 4) {
      const r = o.onDone(buf);
      if (typeof r === 'string') { buf = ''; setTimeout(() => draw(r), 120); }
    }
  };
  draw();
}
function lockNow(){
  closeSheet();
  showPad({title:t('enterPin'), forgot:true, onDone:p => { if (hashPin(p) === db.settings.pin) { hidePad(); return; } return t('wrongPin'); }});

      if (p2 !== p1) return t('pinMismatch');

    }});

}

}

/* ---------- backup / restore ---------- */
function exportData(){
  const s = Object.assign({}, db.settings); delete s.pin; delete s.mailKey; delete s.mailPending;
  return JSON.stringify({app:'duka-ledger', version:1, exportedAt:Date.now(), customers:db.customers, entries:db.entries, settings:s});
}
/* Email backup: when an access key is saved in Settings the backup is emailed on its own (Web3Forms, free).
   Without a key, Back up now saves the file and then opens the mail app with the details filled in. */
const BACKUP_EMAIL = 'works00404@gmail.com';
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
function backupInfo(){
  let from = 0, to = 0;
  for (const e of db.entries) { if (!from || e.ts < from) from = e.ts; if (e.ts > to) to = e.ts; }
  const now = Date.now();
  if (!from) from = to = now;
  const owed = r2(allStats().reduce((a, x) => a + (x.s.bal > 0 ? x.s.bal : 0), 0));
  return {shop:db.settings.shop || '(no shop name)', from, to, at:now, customers:db.customers.length, entries:db.entries.length, owed};
}
const mailSubject = i => 'Duka Ledger backup - ' + i.shop + ' (' + fmtD(i.from) + ' to ' + fmtD(i.to) + ')';
function mailText(i, data){
  const lines = ['Shop: ' + i.shop, 'Records from: ' + fmtD(i.from), 'Records to: ' + fmtD(i.to),
    'Backed up on: ' + new Date(i.at).toLocaleString('en-GB', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}),
    'Customers: ' + i.customers, 'Entries: ' + i.entries, 'Total owed: ' + money(i.owed)];
  if (data) lines.push('', '----- BACKUP DATA (save into a .json file to restore) -----', data);
  return lines.join('\n');
}
/* returns true = sent, false = rejected (bad key), 'net' = no connection, null = no key set */
async function sendBackupEmail(i, data){
  const key = db.settings.mailKey;
  if (!key) return null;
  const inc = data.length <= 150000;
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const to = setTimeout(() => { if (ctl) ctl.abort(); }, 25000);
  try {
    const r = await fetch('https://api.web3forms.com/submit', {
      method:'POST', headers:{'Content-Type':'application/json', 'Accept':'application/json'}, signal:ctl ? ctl.signal : undefined,
      body:JSON.stringify({access_key:key, subject:mailSubject(i), from_name:'Duka Ledger',
        message:mailText(i, inc ? data : '') + (inc ? '' : '\n\n(Too large to include. Use the backup file saved on the phone.)')})
    });
    const j = await r.json().catch(() => ({}));
    return !!(r.ok && j.success === true);
  } catch (e) { return 'net'; }
  finally { clearTimeout(to); }
}
function openMailApp(i){
  const href = 'mailto:' + BACKUP_EMAIL + '?subject=' + encodeURIComponent(mailSubject(i)) +
    '&body=' + encodeURIComponent(mailText(i) + '\n\n(Attach the backup file you just saved.)');
  const a = document.createElement('a');
  a.href = href; document.body.appendChild(a); a.click(); a.remove();
}
async function retryMail(){
  if (!db.settings.mailKey || !db.settings.mailPending || retryMail.busy) return;
  retryMail.busy = true;
  const r = await sendBackupEmail(backupInfo(), exportData());
  retryMail.busy = false;
  if (r === 'net') return;
  db.settings.mailPending = false; save();
  if (r === true) toast(t('emailSent', {to:BACKUP_EMAIL}), 4200);
}
async function backup(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const name = 'duka-ledger-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '.json';
  const data = exportData(), info = backupInfo();
  const hasKey = !!db.settings.mailKey;
  if (hasKey) toast(t('emailSending'), 6000);
  const mailP = hasKey ? sendBackupEmail(info, data) : Promise.resolve(null);   // runs while the share sheet is open
  let saved = false, cancelled = false;
  try {
    const file = new File([data], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:'Duka Ledger'}); saved = true; }
  } catch (e) { if (e && e.name === 'AbortError') cancelled = true; }
  if (!saved && !cancelled) {
    const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    saved = true;
  }
  const mail = await mailP;
  if (mail === 'net') { db.settings.mailPending = true; save(); }
  if (!saved && mail !== true) return;
  db.settings.lastBackup = Date.now(); save(); render();
  if (mail === true) toast(t('emailSent', {to:BACKUP_EMAIL}), 4200);
  else if (mail === 'net') toast(t('emailQueued'), 4200);
  else if (mail === false) toast(t('emailRejected'), 4800);
  else { toast(t('backupDone')); setTimeout(() => openMailApp(info), 700); }
}
function sanitize(d){
  const b = blank();
  const customers = d.customers.filter(c => c && typeof c.id === 'string' && typeof c.name === 'string').map(c => ({
    id:c.id, name:c.name, phone:String(c.phone || ''), limitAmt:Math.max(0, Number(c.limitAmt) || 0), limitDays:Math.max(0, Number(c.limitDays) || 0),
    created:Number(c.created) || Date.now(), sample:!!c.sample}));
  const ids = new Set(customers.map(c => c.id));
  const entries = d.entries.filter(e => e && ids.has(e.cid) && (e.type === 'credit' || e.type === 'payment') && isFinite(e.amt) && e.amt > 0 && isFinite(e.ts))
    .map(e => ({id:String(e.id || uid()), cid:e.cid, type:e.type, amt:Number(e.amt), note:String(e.note || ''), ts:Number(e.ts)}));
  const settings = Object.assign(b.settings, d.settings || {}); settings.pin = ''; settings.mailKey = ''; settings.mailPending = false;
  return {v:1, customers, entries, settings};
}
function readBackup(file, cb){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || d.app !== 'duka-ledger' || !Array.isArray(d.customers) || !Array.isArray(d.entries)) throw new Error('bad');
      cb(sanitize(d));
    } catch (e) { toast(t('badFile')); }
  };
  r.onerror = () => toast(t('badFile'));
  r.readAsText(file);
}
function applyRestore(inc){
  const mk = db.settings.mailKey || '';
  db = inc; db.settings.mailKey = mk; save(); ui = newUi(); navDepth = 0; render(); toast(t('restored'));
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'tab': buzz(); navTo(id, null); break;
    case 'open': navTo(ui.tab, id); break;
    case 'back': goBack(); break;
    case 'sms': { const c = cust(id), lk = c && remindLinks(c, stats(c)); if (lk) openSms(lk.sms); break; }
    case 'copy-msg': { const c = cust(id); if (c) copyText(remindText(c, stats(c))).then(ok => toast(ok ? t('copied') : t('smsHint'))); break; }
    case 'new-entry': openEntry(null, 'credit'); break;
    case 'entry-for': openEntry(id, el.dataset.type); break;
    case 'add-cust': openCust(null); break;
    case 'edit-cust': openCust(id); break;
    case 'close-sheet': closeSheet(); break;
    case 'confirm-yes': { const fn = pendingConfirm; pendingConfirm = null; closeSheet(); if (fn) fn(); break; }
    case 'es-type': syncEs(); es.type = id; es.warn = null; drawEntry(); break;
    case 'es-pick': es.cid = id; es.q = ''; es.warn = null; drawEntry(); break;
    case 'es-change': syncEs(); es.cid = null; es.warn = null; drawEntry(); break;
    case 'es-newc': {
      const name = $('#es-q').value.trim(); if (!name) break;
      syncEs();
      const c = {id:uid(), name, phone:'', limitAmt:0, limitDays:0, created:Date.now()};
      db.customers.push(c); save(); SA = null; es.cid = c.id; es.q = ''; drawEntry(); break;
    }
    case 'es-save': saveEntry(false); break;
    case 'es-force': saveEntry(true); break;
    case 'es-unwarn': syncEs(); es.warn = null; drawEntry(); break;
    case 'cs-save': saveCust(id); break;
    case 'cs-del': { const c = cust(id); openConfirm(t('delCustQ', {name:c.name}), t('yesDelete'), () => {
      db.customers = db.customers.filter(x => x.id !== id); db.entries = db.entries.filter(x => x.cid !== id);
      ui.cust = null; save(); render(); }, true); break; }
    case 'del-entry': openConfirm(t('delEntryQ'), t('yesDelete'), () => { db.entries = db.entries.filter(x => x.id !== id); save(); render(); }, true); break;
    case 'od': ui.od = Number(id); render(); break;
    case 'acc': setAcc(id); buzz(); break;
    case 'quick': openEntry(null, el.dataset.type); break;
    case 'sort': { ui.sort[ui.tab] = id; const ch = $('#chips'); if (ch) ch.innerHTML = chipsHtml(); renderList(); buzz(); break; }
    case 'toggle-edit': ui.edit = !ui.edit; render(); break;
    case 'es-add': { syncEs(); const cur = parseFloat(String(es.amt).replace(/[^0-9.]/g, '')) || 0; es.amt = String(r2(cur + Number(id))); const f = $('#es-amt'); if (f) f.value = es.amt; buzz(); break; }
    case 'es-full': { es.amt = String(id); const f = $('#es-amt'); if (f) f.value = es.amt; buzz(); break; }
    case 'lang': db.settings.lang = id; save(); render(); break;
    case 'pin-set': startSetPin(); break;
    case 'pin-change': verifyPin(startSetPin); break;
    case 'pin-remove': verifyPin(() => { db.settings.pin = ''; save(); render(); toast(t('pinRemoved')); }); break;
    case 'lock-now': lockNow(); break;
    case 'backup': backup(); break;
    case 'restore': $('#st-file').click(); break;
    case 'erase': openConfirm(t('eraseQ'), t('eraseBtn'), () => { const s = db.settings; db = blank(); db.settings = s; db.settings.lastBackup = 0; save(); render(); toast(t('erased')); }, true); break;
    case 'sample': loadSample(); break;
    case 'rm-sample': {
      const ids = new Set(db.customers.filter(c => c.sample).map(c => c.id));
      db.customers = db.customers.filter(c => !ids.has(c.id)); db.entries = db.entries.filter(e => !ids.has(e.cid));
      save(); render(); break;
    }
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'q') { ui.q = e.target.value; renderList(); }
  else if (id === 'es-q' && es) { es.q = e.target.value; fillSugg(); }
  else if (id === 'es-amt' && es) es.amt = e.target.value;
  else if (id === 'es-note' && es) es.note = e.target.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.set) {
    const k = el.dataset.set;
    if (k === 'shop') db.settings.shop = el.value.trim();
    else db.settings[k] = Math.max(0, Math.round(parseFloat(el.value) || 0));
    save(); renderTop(); renderTabs(); syncProf(); refreshAcc(); toast(t('saved'));
  } else if (el.dataset && el.dataset.setstr) {
    db.settings[el.dataset.setstr] = el.value.trim();
    if (!db.settings.mailKey) db.settings.mailPending = false;
    save(); refreshMailPill(); refreshAcc(); toast(t('saved'));
  } else if (el.id === 'st-file' && el.files && el.files[0]) {
    readBackup(el.files[0], inc => openConfirm(t('restoreQ', {n:inc.customers.length}), t('restore'), () => applyRestore(inc), true));
    el.value = '';
  } else if (el.id === 'lock-file' && el.files && el.files[0]) {
    readBackup(el.files[0], inc => { applyRestore(inc); hidePad(); });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) { closeSheet(); return; }
  if (e.key === 'Enter' && es && (e.target.id === 'es-amt' || e.target.id === 'es-note')) { e.preventDefault(); saveEntry(false); }
});

function init(){
  db = load();
  const st = history.state;                       // after a reload, return to the screen the person was on
  if (st && st.tab) { ui.tab = st.tab; ui.cust = st.cust && cust(st.cust) ? st.cust : null; }
  try { history.replaceState(curState(), ''); } catch (e) {}
  render(); animView();
  if (db.settings.pin) lockNow();
  retryMail();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
}
/* header shadow once the page scrolls */
window.addEventListener('scroll', () => { $('#top').classList.toggle('scrolled', window.scrollY > 4); }, {passive:true});
$('#view').addEventListener('animationend', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('view-in'); });
window.addEventListener('online', retryMail);
/* drag the handle at the top of a sheet downwards to close it */
(function(){
  const sh = $('#sheet');
  let y0 = null, dy = 0, pan = null;
  sh.addEventListener('touchstart', e => {
    if (!e.target.closest('.grab')) return;
    pan = sh.querySelector('.panel'); y0 = e.touches[0].clientY; dy = 0; pan.style.transition = 'none';
  }, {passive:true});
  sh.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0); pan.style.transform = 'translateY(' + dy + 'px)';
  }, {passive:true});
  const end = () => {
    if (y0 == null) return;
    const p = pan; y0 = null; p.style.transition = 'transform .18s ease';
    if (dy > 90) { p.style.transform = 'translateY(100%)'; setTimeout(() => closeSheet(), 160); }
    else p.style.transform = '';
  };
  sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end);
})();
init();
</script>
</body>
