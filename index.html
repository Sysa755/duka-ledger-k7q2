<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3FA0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1320" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duka Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Duka Ledger</title>
<style>
/* Layout: one-column phone app styled like a counter book: ruled lines, red margin rule, ballpoint-blue ink, double-underlined totals. */
:root{
  --paper:#F2F6FA; --card:#FFFFFF; --text:#16203A; --muted:#566178; --line:#D3DCE8;
  --ink:#1B3FA0; --on-ink:#FFFFFF; --margin:#D9493C;
  --good:#17724A; --on-good:#FFFFFF; --good-bg:#E2F4EA;
  --warn:#8A5A00; --warn-bg:#FFF0CF; --bad:#B0261C; --bad-bg:#FDE6E3;
  --scrim:rgba(10,15,30,.5);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0E1320; --card:#171E2E; --text:#E8ECF5; --muted:#9BA7BE; --line:#2A3448;
    --ink:#8EA8FF; --on-ink:#0E1320; --margin:#E8685C;
    --good:#5CCB92; --on-good:#0E1320; --good-bg:#16372A;
    --warn:#F2B84B; --warn-bg:#3A2D0E; --bad:#FF8C82; --bad-bg:#40191A;
    --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--text);font:16px/1.4 var(--font);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h2,h3,p{margin:0}

#app{max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:max(14px,env(safe-area-inset-top,0px)) 4px}
.brand{font-weight:800;font-size:1.3rem;letter-spacing:-.01em;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#view{padding-bottom:170px}

.total{padding:12px 0 14px}
.label,.lbl{display:block;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.total .label{margin:0 0 4px}
.big{display:inline-block;font-size:2.4rem;line-height:1.15;font-weight:800;font-variant-numeric:tabular-nums;border-bottom:4px double var(--ink);padding-bottom:2px}
.subline{margin-top:8px;color:var(--muted);font-size:.9rem}
.bad-t{color:var(--bad);font-weight:700}
.hint{color:var(--muted);font-size:.88rem;margin:6px 0 10px}
.h{font-size:1.3rem;margin:12px 0 4px}

.inp{display:block;width:100%;min-height:48px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
.inp:focus{border-color:var(--ink)}
.inp.big-in{font-size:1.6rem;font-weight:800;min-height:58px;font-variant-numeric:tabular-nums}
#view>.inp{background:var(--card);margin-bottom:12px}

.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.pay{border-color:var(--good);color:var(--good)}
.btn.pay.primary{background:var(--good);color:var(--on-good)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.sm{min-height:40px;padding:0 12px;font-size:.88rem}
.btns{display:flex;gap:10px;margin-top:16px}
.btns .btn{flex:1}
.link{background:none;border:0;padding:6px 0;color:var(--ink);text-decoration:underline;font-weight:600;min-height:32px}
.link.sm{font-size:.8rem;color:var(--muted);font-weight:500}

.book{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{display:flex;width:100%;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;text-align:left;min-height:60px}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--muted);font-size:.82rem}
.rt{text-align:right;flex:none}
.amt{display:block;font-weight:800;font-variant-numeric:tabular-nums}
.amt.good{color:var(--good)}
.amt.zero{color:var(--muted)}
.rt small{color:var(--muted);font-size:.8rem}
.rt small.bad-t{color:var(--bad)}
.row-act{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px}
.tag{display:inline-block;font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.none{padding:26px 16px;text-align:center;color:var(--muted)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.9rem;font-weight:600}
.banner .btn{min-height:40px;border-color:currentColor;color:inherit;flex:none}

.empty{padding:28px 4px;display:flex;flex-direction:column;gap:12px}
.empty h2{font-size:1.4rem}
.empty p{color:var(--muted)}

.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 12px}
.seg button{flex:1;min-height:46px;background:var(--card);border:0;border-right:1px solid var(--line);font-weight:700;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.seg button.pay[aria-pressed="true"]{background:var(--good);color:var(--on-good)}

.back{background:none;border:0;color:var(--ink);font-weight:700;padding:12px 0 4px;min-height:44px}
.head{padding:4px 0 14px}
.head h2{font-size:1.5rem;overflow-wrap:anywhere}
.head .ph{color:var(--muted)}
.head .big{margin-top:8px}
.head .lim{color:var(--muted);font-size:.88rem;margin-top:8px}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two-btn .btn{min-height:52px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}

.led-h,.led{display:grid;grid-template-columns:58px minmax(0,1fr) auto}
.led-h{background:var(--paper);border-bottom:3px double var(--line);font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.led-h span{padding:8px 10px}
.led{border-bottom:1px solid var(--line)}
.led:last-child{border-bottom:0}
.led .d{border-right:2px solid var(--margin);padding:10px 4px;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.led .d b{display:block;font-size:1.2rem}
.led .d span{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.led .m{padding:10px 12px;min-width:0}
.led .m .what{font-weight:600;overflow-wrap:anywhere}
.led .m .ty{font-size:.76rem;color:var(--muted)}
.led .a{padding:10px 14px 10px 4px;text-align:right;font-variant-numeric:tabular-nums}
.led .a b{display:block}
.led .a.cr b{color:var(--ink)}
.led .a.pm b{color:var(--good)}
.led .a span{font-size:.76rem;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 14px 16px;margin-top:12px}
.card h3{font-size:1rem;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card .acts .btn{flex:1 1 auto}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;border-top:3px solid transparent;margin-top:-1px;min-height:54px;padding:8px 2px;font-weight:700;font-size:.82rem;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
.tab .n{display:inline-block;min-width:20px;margin-left:5px;padding:0 6px;border-radius:99px;background:var(--bad-bg);color:var(--bad);font-size:.74rem}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));min-height:54px;padding:0 22px;border-radius:99px;border:0;background:var(--ink);color:var(--on-ink);font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:21}

#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;width:100%;max-width:560px;max-height:94%;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding-block:18px max(18px,env(safe-area-inset-bottom,0px));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.panel h2{font-size:1.2rem;margin-bottom:4px}
.picked{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-top:6px}
.picked b{display:block;overflow-wrap:anywhere}
.picked small{color:var(--muted)}
.sugg{display:flex;justify-content:space-between;gap:10px;width:100%;min-height:46px;align-items:center;padding:0 12px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.sugg small{color:var(--muted);font-variant-numeric:tabular-nums}
.sugg.add{color:var(--ink);font-weight:700}
#es-sugg{margin-top:4px;max-height:34vh;overflow:auto}
.warnbox{margin-top:14px;padding:12px;border-radius:10px;background:var(--warn-bg);color:var(--warn)}
.warnbox ul{margin:6px 0 0;padding-left:18px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));max-width:min(92vw,420px);background:var(--text);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.92rem;z-index:80;text-align:center}

#lock{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
.pad{width:100%;max-width:320px;text-align:center}
.pad h2{font-size:1.3rem}
.pad .sub{color:var(--muted);min-height:1.4em;margin-top:6px}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 24px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.keys button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:1.5rem;font-weight:700}
.pad .btn{margin-top:8px;width:100%}
.filebtn{cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="tabs-in" id="tabs-in"></div></nav>
<button class="fab" id="fab" data-act="new-entry"></button>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="lock" hidden></div>
<input type="file" id="st-file" accept=".json,application/json" hidden>

/* ---------- state & storage ---------- */
let storageOk = true;
function blank(){
  return {v:1, customers:[], entries:[], settings:{lang:'en', shop:'', defAmt:2000, defDays:14, pin:'', lastBackup:0}};
}
let db = blank();
function t(k, p){
  let s = (L[db.settings.lang] || L.en)[k];
  if (s == null) s = L.en[k];
  if (s == null) s = k;
  if (p) for (const x in p) s = s.split('{' + x + '}').join(p[x]);
  return s;
}

/* ---------- ledger maths ---------- */
/* Payments are applied to the oldest credit first. "Days owing" is the age of the oldest credit still unpaid. */
function stats(c, list){
  const es = (list || db.entries.filter(e => e.cid === c.id)).slice().sort((a, b) => a.ts - b.ts);
  let credit = 0, paid = 0, lastPay = 0;
  for (const e of es) { if (e.type === 'credit') credit += e.amt; else { paid += e.amt; if (e.ts > lastPay) lastPay = e.ts; } }
  const bal = r2(credit - paid);
  let oldest = 0;
  if (bal > 0) {
    let p = paid;
    for (const e of es) {
      if (e.type !== 'credit') continue;
      if (p >= e.amt - 0.005) { p -= e.amt; continue; }
      oldest = e.ts; break;
    }
  }
  const days = oldest ? Math.max(0, Math.floor((Date.now() - oldest) / DAY)) : 0;
  const limA = c.limitAmt > 0 ? c.limitAmt : db.settings.defAmt;
  const limD = c.limitDays > 0 ? c.limitDays : db.settings.defDays;
  return {bal, days, oldest, lastPay, limA, limD, es,
          overAmt: limA > 0 && bal > limA,
          overDays: limD > 0 && bal > 0 && days > limD};
}
let SA = null;
function allStats(){
  if (SA) return SA;
  const m = {};
  for (const e of db.entries) (m[e.cid] || (m[e.cid] = [])).push(e);
  SA = db.customers.map(c => ({c, s: stats(c, m[c.id] || [])}));
  return SA;
}
const dl = n => n <= 0 ? t('today') : n === 1 ? t('day1') : t('days', {n});
function whenText(ts){
  if (!ts) return t('never');
  const n = Math.floor((Date.now() - ts) / DAY);
  return n <= 0 ? t('today') : n === 1 ? t('yesterday') : t('daysAgo', {n});
}
function locale(){ return db.settings.lang === 'sw' ? 'sw-KE' : 'en-KE'; }
function waNumber(p){
  let d = String(p || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = '254' + d.slice(1);
  else if (d.length === 9 && /^[17]/.test(d)) d = '254' + d;
  return d;
}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function remindText(c, s){
  return t('remindMsg', {name:c.name, shop:db.settings.shop || t('shopFallback'), amt:money(s.bal)});
}
function remindLinks(c, s){
  const n = waNumber(c.phone);
  if (!n) return null;
  const q = encodeURIComponent(remindText(c, s));
  /* Android reads "?body=", iPhone reads "&body=" */
  return {wa:'https://wa.me/' + n + '?text=' + q, sms:'sms:+' + n + (isIOS ? '&' : '?') + 'body=' + q};
}
function remindBtns(c, s){
  if (!(s.bal > 0)) return '';
  const lk = remindLinks(c, s);
  return (lk ? '<a class="btn sm" href="' + lk.wa + '" target="_blank" rel="noopener">WhatsApp</a>' +
               '<button class="btn sm" data-act="sms" data-id="' + c.id + '">SMS</button>' : '') +
    '<button class="btn sm ghost" data-act="copy-msg" data-id="' + c.id + '">' + esc(t('copy')) + '</button>';
}
function openSms(href){
  let left = false;
  const mark = () => { if (document.hidden) left = true; };
  const mark2 = () => { left = true; };
  document.addEventListener('visibilitychange', mark);
  window.addEventListener('blur', mark2);
  const a = document.createElement('a');
  a.href = href; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => {
    document.removeEventListener('visibilitychange', mark);
    window.removeEventListener('blur', mark2);
    if (!left) toast(t('smsHint'));
  }, 1800);
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove();
    return ok;
  }
}
function matches(c, q){
  if (!q) return true;
  const ql = q.toLowerCase(), qd = q.replace(/\D/g, '');
  return c.name.toLowerCase().includes(ql) || (qd.length > 0 && String(c.phone || '').replace(/\D/g, '').includes(qd));
}

/* ---------- navigation (phone back button + in-app Back) ----------
   Every screen change (tab, customer) and every open sheet is one history entry,
   so the phone's back button steps back through them instead of leaving the app. */
let navDepth = 0, sheetPushed = false, ignorePop = 0;
function curState(){ return {tab:ui.tab, cust:ui.cust, q:ui.q}; }
function navTo(tab, cust){
  if (tab === ui.tab && cust === ui.cust) { window.scrollTo(0, 0); return; }
  try { history.replaceState(Object.assign(curState(), {sy:window.scrollY}), ''); } catch (e) {}
  ui.tab = tab; ui.cust = cust; ui.q = '';
  try { history.pushState(curState(), ''); navDepth++; } catch (e) {}
  render(); window.scrollTo(0, 0);
}
function goBack(){
  if (navDepth > 0) { history.back(); return; }
  ui.cust = null;
  try { history.replaceState(curState(), ''); } catch (e) {}
  render();
}
window.addEventListener('popstate', e => {
  if (ignorePop > 0) {            // we closed a sheet ourselves; just keep the entry in step with the screen
    ignorePop--;
    try { history.replaceState(curState(), ''); } catch (_) {}
    return;
  }
  if (!$('#sheet').hidden) { closeSheet(true); return; }   // back pressed while a sheet is open: close it
  const st = e.state;
  if (!st || st.sheet) return;
  navDepth = Math.max(0, navDepth - 1);
  ui.tab = st.tab || 'owes'; ui.cust = st.cust || null; ui.q = st.q || '';
  render(); window.scrollTo(0, st.sy || 0);
});

function toast(msg){
  const el = $('#toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.h);
  toast.h = setTimeout(() => { el.hidden = true; }, 2800);
}

function rowHtml(c, s, withRemind){

function listFor(kind){
  const q = ui.q.trim();
  let items = allStats().filter(x => matches(x.c, q));
  let none;
  if (kind === 'owes') { items = items.filter(x => x.s.bal > 0).sort((a, b) => b.s.bal - a.s.bal); none = t('noOwes'); }
  else if (kind === 'overdue') { items = items.filter(x => x.s.bal > 0 && x.s.days >= ui.od).sort((a, b) => b.s.days - a.s.days || b.s.bal - a.s.bal); none = t('noOverdue', {n:ui.od}); }
  else { items = items.sort((a, b) => a.c.name.localeCompare(b.c.name)); none = t('noMatch'); }
  if (q && !items.length) none = t('noMatch');
  if (!items.length) return '<div class="book"><div class="none">' + esc(none) + '</div></div>';
  return '<div class="book">' + items.map(x => rowHtml(x.c, x.s, kind === 'overdue')).join('') + '</div>';
}

function openSheet(html){
  const r = $('#sheet');
  r.innerHTML = '<div class="scrim" data-act="close-sheet"></div><div class="panel" role="dialog" aria-modal="true">' + html + '</div>';
  r.hidden = false;
  document.body.classList.add('noscroll');
  if (!sheetPushed) {
    try { history.pushState(Object.assign(curState(), {sheet:1}), ''); sheetPushed = true; } catch (e) {}
  }
}
function closeSheet(fromPop){
  const r = $('#sheet');
  r.hidden = true; r.innerHTML = '';
  document.body.classList.remove('noscroll');
  es = null;
  if (sheetPushed) {
    sheetPushed = false;
    if (fromPop !== true) { ignorePop++; try { history.back(); } catch (e) { ignorePop--; } }
  }
}

         '<button class="btn ' + (isC ? 'primary' : 'pay primary') + '" data-act="es-save">' + esc(t(isC ? 'saveCredit' : 'savePayment')) + '</button></div>';
  }
  openSheet(h);
  if (!c) fillSugg();
  setTimeout(() => { const f = $(c ? '#es-amt' : '#es-q'); if (f) f.focus(); }, 60);
}
function fillSugg(){
  const box = $('#es-sugg');
  if (!box || !es) return;
  const q = es.q.trim(), ql = q.toLowerCase();
  const touch = {};
  for (const e of db.entries) if (!touch[e.cid] || e.ts > touch[e.cid]) touch[e.cid] = e.ts;
  const sm = {};
  for (const x of allStats()) sm[x.c.id] = x.s;
  const list = db.customers.filter(c => matches(c, q))
    .sort((a, b) => (touch[b.id] || b.created || 0) - (touch[a.id] || a.created || 0)).slice(0, 6);
  let h = list.map(c => {
    const s = sm[c.id];
    return '<button class="sugg" data-act="es-pick" data-id="' + c.id + '"><span>' + esc(c.name) + '</span><small>' + (s && s.bal > 0 ? money(s.bal) : '') + '</small></button>';
  }).join('');
  if (q && !db.customers.some(c => c.name.toLowerCase() === ql))
    h += '<button class="sugg add" data-act="es-newc">+ ' + esc(t('addNew', {q})) + '</button>';
  box.innerHTML = h;
}
function saveEntry(force){
  syncEs();
  if (!es.cid) { toast(t('pickCustomer')); return; }
  const amt = r2(parseFloat(String(es.amt).replace(/[^0-9.]/g, '')));
  if (!(amt > 0)) { toast(t('enterAmount')); const f = $('#es-amt'); if (f) f.focus(); return; }
  const c = cust(es.cid), s = stats(c);
  if (es.type === 'credit' && !force) {
    const why = [], nb = r2(s.bal + amt);
    if (s.limA > 0 && nb > s.limA) why.push(t('warnAmt', {bal:money(nb), lim:money(s.limA)}));
    if (s.limD > 0 && s.bal > 0 && s.days > s.limD) why.push(t('warnDays', {d:s.limD, n:s.days}));
    if (why.length) { es.warn = why; drawEntry(); return; }
  }
  db.entries.push({id:uid(), cid:c.id, type:es.type, amt, note:es.note.trim(), ts:Date.now()});
  save(); closeSheet(); render();
  const ns = stats(c);
  toast(c.name + ': ' + (ns.bal > 0 ? t('owes', {amt:money(ns.bal)}) : ns.bal < 0 ? t('paidAhead') : t('settled')));
}

function openCust(id){
  const c = id ? cust(id) : null;
  let h = '<h2>' + esc(t(c ? 'editCustomer' : 'newCustomer')) + '</h2>' +
    '<label class="lbl" for="cs-name">' + esc(t('name')) + '</label><input id="cs-name" class="inp" autocomplete="off" value="' + esc(c ? c.name : '') + '">' +
    '<label class="lbl" for="cs-phone">' + esc(t('phone')) + '</label><input id="cs-phone" class="inp" type="tel" inputmode="tel" autocomplete="off" placeholder="07xx xxx xxx" value="' + esc(c ? c.phone : '') + '">' +
    '<div class="two"><div><label class="lbl" for="cs-la">' + esc(t('limitAmount')) + '</label><input id="cs-la" class="inp" inputmode="numeric" placeholder="' + db.settings.defAmt + '" value="' + (c && c.limitAmt ? c.limitAmt : '') + '"></div>' +
    '<div><label class="lbl" for="cs-ld">' + esc(t('limitDays')) + '</label><input id="cs-ld" class="inp" inputmode="numeric" placeholder="' + db.settings.defDays + '" value="' + (c && c.limitDays ? c.limitDays : '') + '"></div></div>' +
    '<p class="hint">' + esc(t('limitBlank')) + '</p>' +
    '<div class="btns"><button class="btn ghost" data-act="close-sheet">' + esc(t('cancel')) + '</button><button class="btn primary" data-act="cs-save" data-id="' + (c ? c.id : '') + '">' + esc(t('save')) + '</button></div>';
  if (c) h += '<div class="btns"><button class="btn danger" data-act="cs-del" data-id="' + c.id + '">' + esc(t('del')) + '</button></div>';
  openSheet(h);
  setTimeout(() => { const f = $('#cs-name'); if (f && !c) f.focus(); }, 60);
}
function saveCust(id){
  const name = $('#cs-name').value.trim();
  if (!name) { toast(t('nameNeeded')); $('#cs-name').focus(); return; }
  const num = v => Math.max(0, Math.round(parseFloat(v) || 0));
  const data = {name, phone:$('#cs-phone').value.trim(), limitAmt:num($('#cs-la').value), limitDays:num($('#cs-ld').value)};
  if (id) Object.assign(cust(id), data);
  else db.customers.push(Object.assign({id:uid(), created:Date.now()}, data));
  save(); closeSheet(); render(); toast(t('saved'));
}

/* ---------- PIN lock ---------- */
function hashPin(p){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  const s = 'duka|' + p;
  for (let i = 0, ch; i < s.length; i++) { ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function hidePad(){ const el = $('#lock'); el.hidden = true; el.innerHTML = ''; el.onclick = null; }
function showPad(o){
  const el = $('#lock');
  let buf = '';
  el.hidden = false;
  function draw(msg){
    let keys = '';
    for (let i = 1; i <= 9; i++) keys += '<button data-pad="' + i + '">' + i + '</button>';
    keys += '<span></span><button data-pad="0">0</button><button data-pad="del" aria-label="Delete">←</button>';
    el.innerHTML = '<div class="pad"><h2>' + esc(o.title) + '</h2><p class="sub">' + esc(msg || '') + '</p><div class="dots">' +
      [0, 1, 2, 3].map(i => '<i class="' + (i < buf.length ? 'on' : '') + '"></i>').join('') + '</div><div class="keys">' + keys + '</div>' +
      (o.cancelable ? '<button class="btn ghost" data-pad="cancel">' + esc(t('cancel')) + '</button>' : '') +
      (o.forgot ? '<button class="link" data-pad="forgot">' + esc(t('forgotPin')) + '</button>' : '') + '</div>';
  }
  el.onclick = e => {
    const b = e.target.closest('[data-pad]');
    if (!b) return;
    const k = b.dataset.pad;
    if (k === 'cancel') { hidePad(); return; }
    if (k === 'forgot') {
      el.innerHTML = '<div class="pad"><h2>' + esc(t('forgotTitle')) + '</h2><p class="sub" style="margin:10px 0 18px">' + esc(t('forgotBody')) + '</p>' +
        '<label class="btn primary filebtn">' + esc(t('chooseBackup')) + '<input type="file" id="lock-file" accept=".json,application/json" hidden></label>' +
        '<button class="btn ghost" data-pad="again">' + esc(t('back')) + '</button></div>';
      return;
    }
    if (k === 'again') { buf = ''; draw(); return; }
    if (k === 'del') buf = buf.slice(0, -1);
    else if (buf.length < 4) buf += k;
    draw();
    if (buf.length === 4) {
      const r = o.onDone(buf);
      if (typeof r === 'string') { buf = ''; setTimeout(() => draw(r), 120); }
    }
  };
  draw();
}
function lockNow(){
  closeSheet();
  showPad({title:t('enterPin'), forgot:true, onDone:p => { if (hashPin(p) === db.settings.pin) { hidePad(); return; } return t('wrongPin'); }});
}
function startSetPin(){
  showPad({title:t('pinNew'), cancelable:true, onDone:p1 => {
    showPad({title:t('pinConfirm'), cancelable:true, onDone:p2 => {
      if (p2 !== p1) return t('pinMismatch');
      db.settings.pin = hashPin(p2); save(); hidePad(); render(); toast(t('pinSet'));
    }});
  }});
}
function verifyPin(next){
  showPad({title:t('enterPin'), cancelable:true, onDone:p => { if (hashPin(p) !== db.settings.pin) return t('wrongPin'); hidePad(); next(); }});
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (db.settings.pin && hiddenAt && Date.now() - hiddenAt > 120000) lockNow();
});

/* ---------- backup / restore ---------- */
function exportData(){
  const s = Object.assign({}, db.settings); delete s.pin;
  return JSON.stringify({app:'duka-ledger', version:1, exportedAt:Date.now(), customers:db.customers, entries:db.entries, settings:s});
}
function markBackup(){ db.settings.lastBackup = Date.now(); save(); render(); toast(t('backupDone')); }
async function backup(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const name = 'duka-ledger-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '.json';
  const data = exportData();
  try {
    const file = new File([data], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:'Duka Ledger'}); markBackup(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  markBackup();
}
function sanitize(d){
  const b = blank();
  const customers = d.customers.filter(c => c && typeof c.id === 'string' && typeof c.name === 'string').map(c => ({
    id:c.id, name:c.name, phone:String(c.phone || ''), limitAmt:Math.max(0, Number(c.limitAmt) || 0), limitDays:Math.max(0, Number(c.limitDays) || 0),
    created:Number(c.created) || Date.now(), sample:!!c.sample}));
  const ids = new Set(customers.map(c => c.id));
  const entries = d.entries.filter(e => e && ids.has(e.cid) && (e.type === 'credit' || e.type === 'payment') && isFinite(e.amt) && e.amt > 0 && isFinite(e.ts))
    .map(e => ({id:String(e.id || uid()), cid:e.cid, type:e.type, amt:Number(e.amt), note:String(e.note || ''), ts:Number(e.ts)}));
  const settings = Object.assign(b.settings, d.settings || {}); settings.pin = '';
  return {v:1, customers, entries, settings};
}
function readBackup(file, cb){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || d.app !== 'duka-ledger' || !Array.isArray(d.customers) || !Array.isArray(d.entries)) throw new Error('bad');
      cb(sanitize(d));
    } catch (e) { toast(t('badFile')); }
  };
  r.onerror = () => toast(t('badFile'));
  r.readAsText(file);
}
function applyRestore(inc){
  db = inc; save(); ui = {tab:'owes', q:'', od:7, cust:null}; navDepth = 0; render(); toast(t('restored'));
}

/* ---------- sample data ---------- */
function loadSample(){
  const now = Date.now();
  const mk = (name, phone, la, ld) => ({id:uid(), name, phone, limitAmt:la || 0, limitDays:ld || 0, created:now, sample:true});
  const ev = (c, type, amt, ago, note) => db.entries.push({id:uid(), cid:c.id, type, amt, note:note || '', ts:now - ago * DAY});
  const a = mk('Mama Joy', '0712 345 678'), b = mk('Mzee Otieno', '0723 111 222', 1500, 10), c = mk('Wanjiku', '0734 555 019'),
        d = mk('Baba Brian', '0701 888 340'), e = mk('Kamau Hardware', '');
  db.customers.push(a, b, c, d, e);
  ev(a, 'credit', 450, 9, 'sugar, bread'); ev(a, 'credit', 400, 3, 'maziwa, unga');
  ev(b, 'credit', 1200, 21, 'unga, mafuta'); ev(b, 'payment', 400, 14); ev(b, 'credit', 700, 5, 'sukari');
  ev(c, 'credit', 2600, 35, 'school shopping');
  ev(d, 'credit', 180, 1, 'airtime'); ev(d, 'payment', 180, 0);
  ev(e, 'credit', 950, 16, 'cement, nails');
  save(); render();
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'tab': navTo(id, null); break;
    case 'open': navTo(ui.tab, id); break;
    case 'back': goBack(); break;
    case 'sms': { const c = cust(id), lk = c && remindLinks(c, stats(c)); if (lk) openSms(lk.sms); break; }
    case 'copy-msg': { const c = cust(id); if (c) copyText(remindText(c, stats(c))).then(ok => toast(ok ? t('copied') : t('smsHint'))); break; }
    case 'new-entry': openEntry(null, 'credit'); break;
    case 'entry-for': openEntry(id, el.dataset.type); break;
    case 'add-cust': openCust(null); break;
    case 'edit-cust': openCust(id); break;
    case 'close-sheet': closeSheet(); break;
    case 'confirm-yes': { const fn = pendingConfirm; pendingConfirm = null; closeSheet(); if (fn) fn(); break; }
    case 'es-type': syncEs(); es.type = id; es.warn = null; drawEntry(); break;
    case 'es-pick': es.cid = id; es.q = ''; es.warn = null; drawEntry(); break;
    case 'es-change': syncEs(); es.cid = null; es.warn = null; drawEntry(); break;
    case 'es-newc': {
      const name = $('#es-q').value.trim(); if (!name) break;
      syncEs();
      const c = {id:uid(), name, phone:'', limitAmt:0, limitDays:0, created:Date.now()};
      db.customers.push(c); save(); SA = null; es.cid = c.id; es.q = ''; drawEntry(); break;
    }
    case 'es-save': saveEntry(false); break;
    case 'es-force': saveEntry(true); break;
    case 'es-unwarn': syncEs(); es.warn = null; drawEntry(); break;
    case 'cs-save': saveCust(id); break;
    case 'cs-del': { const c = cust(id); openConfirm(t('delCustQ', {name:c.name}), t('yesDelete'), () => {
      db.customers = db.customers.filter(x => x.id !== id); db.entries = db.entries.filter(x => x.cid !== id);
      ui.cust = null; save(); render(); }, true); break; }
    case 'del-entry': openConfirm(t('delEntryQ'), t('yesDelete'), () => { db.entries = db.entries.filter(x => x.id !== id); save(); render(); }, true); break;
    case 'od': ui.od = Number(id); render(); break;
    case 'lang': db.settings.lang = id; save(); render(); break;
    case 'pin-set': startSetPin(); break;
    case 'pin-change': verifyPin(startSetPin); break;
    case 'pin-remove': verifyPin(() => { db.settings.pin = ''; save(); render(); toast(t('pinRemoved')); }); break;
    case 'lock-now': lockNow(); break;
    case 'backup': backup(); break;
    case 'restore': $('#st-file').click(); break;
    case 'erase': openConfirm(t('eraseQ'), t('eraseBtn'), () => { const s = db.settings; db = blank(); db.settings = s; db.settings.lastBackup = 0; save(); render(); toast(t('erased')); }, true); break;
    case 'sample': loadSample(); break;
    case 'rm-sample': {
      const ids = new Set(db.customers.filter(c => c.sample).map(c => c.id));
      db.customers = db.customers.filter(c => !ids.has(c.id)); db.entries = db.entries.filter(e => !ids.has(e.cid));
      save(); render(); break;
    }
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'q') { ui.q = e.target.value; renderList(); }
  else if (id === 'es-q' && es) { es.q = e.target.value; fillSugg(); }
  else if (id === 'es-amt' && es) es.amt = e.target.value;
  else if (id === 'es-note' && es) es.note = e.target.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.set) {
    const k = el.dataset.set;
    if (k === 'shop') db.settings.shop = el.value.trim();
    else db.settings[k] = Math.max(0, Math.round(parseFloat(el.value) || 0));
    save(); renderTop(); renderTabs(); toast(t('saved'));
  } else if (el.id === 'st-file' && el.files && el.files[0]) {
    readBackup(el.files[0], inc => openConfirm(t('restoreQ', {n:inc.customers.length}), t('restore'), () => applyRestore(inc), true));
    el.value = '';
  } else if (el.id === 'lock-file' && el.files && el.files[0]) {
    readBackup(el.files[0], inc => { applyRestore(inc); hidePad(); });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && es && (e.target.id === 'es-amt' || e.target.id === 'es-note')) { e.preventDefault(); saveEntry(false); }
});

function init(){
  db = load();
  const st = history.state;                       // after a reload, return to the screen the person was on
  if (st && st.tab) { ui.tab = st.tab; ui.cust = st.cust && cust(st.cust) ? st.cust : null; }
  try { history.replaceState(curState(), ''); } catch (e) {}
  render();
  if (db.settings.pin) lockNow();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
}
init();
</script>
