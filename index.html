<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; connect-src 'self' https://api.web3forms.com; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3FA0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1320" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duka Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Duka Ledger</title>
<style>
/* Layout: one-column phone app styled like a counter book: ruled lines, red margin rule, ballpoint-blue ink, double-underlined totals. */
:root{
  --paper:#F2F6FA; --card:#FFFFFF; --text:#16203A; --muted:#566178; --line:#D3DCE8;
  --ink:#1B3FA0; --on-ink:#FFFFFF; --margin:#D9493C;
  --good:#17724A; --on-good:#FFFFFF; --good-bg:#E2F4EA;
  --warn:#8A5A00; --warn-bg:#FFF0CF; --bad:#B0261C; --bad-bg:#FDE6E3;
  --scrim:rgba(10,15,30,.5);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0E1320; --card:#171E2E; --text:#E8ECF5; --muted:#9BA7BE; --line:#2A3448;
    --ink:#8EA8FF; --on-ink:#0E1320; --margin:#E8685C;
    --good:#5CCB92; --on-good:#0E1320; --good-bg:#16372A;
    --warn:#F2B84B; --warn-bg:#3A2D0E; --bad:#FF8C82; --bad-bg:#40191A;
    --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--text);font:16px/1.4 var(--font);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h2,h3,p{margin:0}

#app{max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:max(14px,env(safe-area-inset-top,0px)) 4px}
.brand{font-weight:800;font-size:1.3rem;letter-spacing:-.01em;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#view{padding-bottom:170px}

.total{padding:12px 0 14px}
.label,.lbl{display:block;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.total .label{margin:0 0 4px}
.big{display:inline-block;font-size:2.4rem;line-height:1.15;font-weight:800;font-variant-numeric:tabular-nums;border-bottom:4px double var(--ink);padding-bottom:2px}
.subline{margin-top:8px;color:var(--muted);font-size:.9rem}
.bad-t{color:var(--bad);font-weight:700}
.hint{color:var(--muted);font-size:.88rem;margin:6px 0 10px}
.h{font-size:1.3rem;margin:12px 0 4px}

.inp{display:block;width:100%;min-height:48px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
.inp:focus{border-color:var(--ink)}
.inp.big-in{font-size:1.6rem;font-weight:800;min-height:58px;font-variant-numeric:tabular-nums}
#view>.inp{background:var(--card);margin-bottom:12px}

.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.pay{border-color:var(--good);color:var(--good)}
.btn.pay.primary{background:var(--good);color:var(--on-good)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.sm{min-height:40px;padding:0 12px;font-size:.88rem}
.btns{display:flex;gap:10px;margin-top:16px}
.btns .btn{flex:1}
.link{background:none;border:0;padding:6px 0;color:var(--ink);text-decoration:underline;font-weight:600;min-height:32px}
.link.sm{font-size:.8rem;color:var(--muted);font-weight:500}

.book{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{display:flex;width:100%;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;text-align:left;min-height:60px}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--muted);font-size:.82rem}
.rt{text-align:right;flex:none}
.amt{display:block;font-weight:800;font-variant-numeric:tabular-nums}
.amt.good{color:var(--good)}
.amt.zero{color:var(--muted)}
.rt small{color:var(--muted);font-size:.8rem}
.rt small.bad-t{color:var(--bad)}
.row-act{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px}
.tag{display:inline-block;font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.none{padding:26px 16px;text-align:center;color:var(--muted)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.9rem;font-weight:600}
.banner .btn{min-height:40px;border-color:currentColor;color:inherit;flex:none}

.empty{padding:28px 4px;display:flex;flex-direction:column;gap:12px}
.empty h2{font-size:1.4rem}
.empty p{color:var(--muted)}

.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 12px}
.seg button{flex:1;min-height:46px;background:var(--card);border:0;border-right:1px solid var(--line);font-weight:700;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.seg button.pay[aria-pressed="true"]{background:var(--good);color:var(--on-good)}

.back{background:none;border:0;color:var(--ink);font-weight:700;padding:12px 0 4px;min-height:44px}
.head{padding:4px 0 14px}
.head h2{font-size:1.5rem;overflow-wrap:anywhere}
.head .ph{color:var(--muted)}
.head .big{margin-top:8px}
.head .lim{color:var(--muted);font-size:.88rem;margin-top:8px}
.preview{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.88rem;line-height:1.5;padding:12px;border:1.5px dashed var(--line);border-radius:10px;background:var(--card);color:var(--text)}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two-btn .btn{min-height:52px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}

.led-h,.led{display:grid;grid-template-columns:58px minmax(0,1fr) auto}
.led-h{background:var(--paper);border-bottom:3px double var(--line);font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.led-h span{padding:8px 10px}
.led{border-bottom:1px solid var(--line)}
.led:last-child{border-bottom:0}
.led .d{border-right:2px solid var(--margin);padding:10px 4px;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.led .d b{display:block;font-size:1.2rem}
.led .d span{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.led .m{padding:10px 12px;min-width:0}
.led .m .what{font-weight:600;overflow-wrap:anywhere}
.led .m .ty{font-size:.76rem;color:var(--muted)}
.led .a{padding:10px 14px 10px 4px;text-align:right;font-variant-numeric:tabular-nums}
.led .a b{display:block}
.led .a.cr b{color:var(--ink)}
.led .a.pm b{color:var(--good)}
.led .a span{font-size:.76rem;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 14px 16px;margin-top:12px}
.card h3{font-size:1rem;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card .acts .btn{flex:1 1 auto}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;border-top:3px solid transparent;margin-top:-1px;min-height:54px;padding:8px 2px;font-weight:700;font-size:.82rem;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
.tab .n{display:inline-block;min-width:20px;margin-left:5px;padding:0 6px;border-radius:99px;background:var(--bad-bg);color:var(--bad);font-size:.74rem}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));min-height:54px;padding:0 22px;border-radius:99px;border:0;background:var(--ink);color:var(--on-ink);font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:21}

#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;width:100%;max-width:560px;max-height:94%;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding-block:18px max(18px,env(safe-area-inset-bottom,0px));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.panel h2{font-size:1.2rem;margin-bottom:4px}
.picked{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-top:6px}
.picked b{display:block;overflow-wrap:anywhere}
.picked small{color:var(--muted)}
.sugg{display:flex;justify-content:space-between;gap:10px;width:100%;min-height:46px;align-items:center;padding:0 12px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.sugg small{color:var(--muted);font-variant-numeric:tabular-nums}
.sugg.add{color:var(--ink);font-weight:700}
#es-sugg{margin-top:4px;max-height:34vh;overflow:auto}
.warnbox{margin-top:14px;padding:12px;border-radius:10px;background:var(--warn-bg);color:var(--warn)}
.warnbox ul{margin:6px 0 0;padding-left:18px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));max-width:min(92vw,420px);background:var(--text);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.92rem;z-index:80;text-align:center}

#lock{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
.pad{width:100%;max-width:320px;text-align:center}
.pad h2{font-size:1.3rem}
.pad .sub{color:var(--muted);min-height:1.4em;margin-top:6px}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 24px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.keys button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:1.5rem;font-weight:700}
.pad .btn{margin-top:8px;width:100%}
.filebtn{cursor:pointer}

/* ===== v3: app-style polish ===== */
.ic{width:22px;height:22px;flex:none}
.btn .ic,.link .ic{width:18px;height:18px;margin-right:6px}
button,.btn,.row-main,.chip,.sugg,.qa{transition:transform .12s ease,background-color .15s ease,border-color .15s ease,opacity .15s ease}
.btn:active,.tab:active,.chip:active,.qa:active,.seg button:active,.ico:active{transform:scale(.96)}
.fab:active{transform:scale(.93)}
.row-main:active,.sugg:active{background:var(--paper)}
.fab{display:flex;align-items:center;gap:8px;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.fab .ic{width:20px;height:20px}
#toast{bottom:calc(142px + env(safe-area-inset-bottom,0px))}

/* sticky app header */
.top{position:sticky;top:0;z-index:15;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:var(--paper);background:color-mix(in srgb,var(--paper) 90%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:box-shadow .2s}
.top.scrolled{box-shadow:0 1px 0 var(--line)}
.top-id{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-size:1.12rem}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--ink);color:var(--on-ink);font-weight:800;font-size:1.1rem}
.avatar.lg{width:56px;height:56px;font-size:1.5rem}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;background:hsl(var(--h) 55% 90%);color:hsl(var(--h) 60% 26%)}
.av.lg-av{width:56px;height:56px;font-size:1.4rem}
@media (prefers-color-scheme: dark){.av{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 70% 82%)}}

/* home */
.hero{margin:6px 0 14px;padding:18px 18px 16px;border-radius:18px;color:var(--on-ink);
  background:linear-gradient(145deg,var(--ink),color-mix(in srgb,var(--ink) 68%,#000));
  box-shadow:0 12px 26px -14px color-mix(in srgb,var(--ink) 80%,transparent)}
@media (prefers-color-scheme: dark){.hero{background:linear-gradient(145deg,var(--ink),color-mix(in srgb,var(--ink) 72%,#fff))}}
.hero .label{color:inherit;opacity:.85;margin:0 0 6px}
.hero .big{border-bottom-color:currentColor;font-size:2.5rem}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hchip{font-size:.8rem;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.2);color:inherit}
@media (prefers-color-scheme: dark){.hchip{background:rgba(0,0,0,.14)}}
.hchip.alert{background:var(--bad-bg);color:var(--bad)}
.hchip.ok{background:var(--good-bg);color:var(--good)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.qa{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:800;text-align:left;color:var(--text)}
.qa .qi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--paper);background:color-mix(in srgb,var(--ink) 14%,transparent);color:var(--ink)}
.qa.pay .qi{background:var(--good-bg);color:var(--good)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 8px}
.sec h3{margin:0;font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips-l{flex:none;align-self:center;font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:.85rem;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.amt-chips{padding:8px 0 0}
.head-id{display:flex;align-items:center;gap:14px}

/* tabs with icons */
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;font-size:.72rem}
.tab .ti{position:relative;display:inline-flex}
.tab .n{position:absolute;top:-6px;left:13px;margin:0;min-width:17px;padding:0 5px;font-size:.65rem;line-height:17px;text-align:center}

/* ledger manage mode + trash */
.sec .btn.sm{min-height:34px}
.book.editing .led-h,.book.editing .led{grid-template-columns:58px minmax(0,1fr) auto 50px}
.led .x{display:flex;align-items:center;justify-content:center;padding-right:8px}
.ico{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--bad);background:var(--bad-bg);color:var(--bad);display:grid;place-items:center;padding:0}
.ico .ic{width:18px;height:18px;margin:0}

/* danger zone (customer sheet) */
.dz{margin-top:22px;padding:14px;border:1.5px dashed var(--bad);border-radius:12px;background:var(--bad-bg)}
.dz-t{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--bad);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.dz-t .ic{width:18px;height:18px}
.dz .hint{margin:6px 0 12px;color:var(--bad)}
.dz .btn{width:100%;background:var(--card)}

/* settings */
.prof{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin:10px 0 2px}
.prof b{display:block;font-size:1.15rem;overflow-wrap:anywhere}
.prof small{color:var(--muted)}
.sgt{display:flex;align-items:center;gap:8px;margin:22px 4px 8px;font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sgt .ic{width:18px;height:18px}
.sg-h{margin:-2px 4px 8px}
.sgroup{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.srow{padding:12px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .lbl{margin:0 0 6px}
.srow .seg{margin:0}
.srow .hint{margin:0}
.srow.line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.srow.line b{font-weight:700;display:block}
.srow.line small{display:block;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.srow .acts{margin-top:0}
.srow .acts .btn{flex:1 1 auto}
.srow .val{font-weight:700;text-align:right}
.pill{flex:none;display:inline-block;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--muted)}
.pill.on{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.sgroup.danger{border-color:var(--bad)}


/* settings accordion */
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px}
.acc.danger{border-color:var(--bad)}
.acc-h{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:10px 14px;background:none;border:0;text-align:left}
.acc-h:active{background:var(--paper)}
.acc-i{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--paper);color:var(--ink)}
.acc.danger .acc-i{background:var(--bad-bg);color:var(--bad)}
.acc-t{flex:1;min-width:0}
.acc-t b{display:block;font-weight:800}
.acc-t small{display:block;color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-c{display:inline-flex;flex:none;color:var(--muted);transition:transform .22s ease}
.acc-c .ic{width:20px;height:20px}
.acc.open .acc-c{transform:rotate(180deg)}
.acc-b{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .24s ease,visibility 0s .24s}
.acc.open .acc-b{grid-template-rows:1fr;visibility:visible;transition-delay:0s}
.acc-in{overflow:hidden;min-height:0}
.acc-in>.srow:first-child{border-top:1px solid var(--line)}

/* sheets + motion */
.grab{position:relative;width:42px;height:5px;border-radius:99px;background:var(--line);margin:-6px auto 14px;touch-action:none}
.grab::before{content:"";position:absolute;inset:-16px -48px}
.panel.anim{animation:sheetUp .24s cubic-bezier(.2,.8,.2,1)}
.scrim.anim{animation:fadeIn .2s ease-out}
.view-in{animation:viewIn .24s ease-out}
.toast-in{animation:toastIn .22s ease-out}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.upd{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:12px;right:12px;margin:0 auto;max-width:440px;z-index:70;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--text);color:var(--paper);font-weight:600;font-size:.92rem;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.upd .btn{background:var(--paper);color:var(--text);border-color:var(--paper)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="tabs-in" id="tabs-in"></div></nav>
<button class="fab" id="fab" data-act="new-entry"></button>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="lock" hidden></div>
<input type="file" id="st-file" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
